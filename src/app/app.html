<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Dayline calendar</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <div class="brand">
          <img src="../../icons/icon-32.png" width="24" height="24" alt="" />
          <span class="name">Dayline</span>
        </div>
        <nav class="views" id="views" role="tablist" aria-label="Views"></nav>
        <div class="bar-right"><button type="button" class="iconbtn" id="open-options" aria-label="Settings" title="Settings"></button></div>
      </header>

      <main id="calendar-view" class="cal-layout">
        <section class="cal-main" aria-label="Month">
          <div class="month-bar">
            <h1 id="month-title" aria-live="polite"></h1>
            <div class="month-nav">
              <button type="button" class="btn" id="today-btn">Today</button>
              <button type="button" class="iconbtn" id="prev" aria-label="Previous month" title="Previous month">&#8249;</button>
              <button type="button" class="iconbtn" id="next" aria-label="Next month" title="Next month">&#8250;</button>
            </div>
          </div>
          <div class="dow" id="dow" aria-hidden="true"></div>
          <div class="grid" id="grid" role="grid" aria-label="Days"></div>
          <p class="hint">Click a day to select it. Hold Ctrl (Cmd on a Mac) and click to add more days, or hold Shift and click to select a stretch of days.</p>
        </section>

        <aside class="day-panel" id="panel" aria-label="Selected days"></aside>
      </main>

      <main id="all-view" class="all-layout" hidden>
        <div class="all-filters" id="all-filters"></div>
        <div id="all-list" class="all-list" aria-live="polite"></div>
      </main>
    </div>
    <script type="module" src="page.js"></script>
  </body>
</html>
