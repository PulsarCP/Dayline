<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Dayline</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app" id="main-view">
      <header class="top">
        <div class="brand">
          <img src="../../icons/icon-32.png" width="22" height="22" alt="" />
          <span class="name">Dayline</span>
        </div>
        <div class="top-right">
          <span class="date-label" id="date-label"></span>
          <button type="button" class="iconbtn" id="open-calendar" aria-label="Open calendar" title="Open calendar"></button>
          <button type="button" class="iconbtn" id="open-options" aria-label="Settings and sections" title="Settings and sections"></button>
        </div>
      </header>

      <form id="add-form" class="add" autocomplete="off">
        <div class="add-row">
          <input
            id="add-input"
            type="text"
            maxlength="300"
            spellcheck="false"
            placeholder="Add something…  “dentist tomorrow 3pm #work”"
            aria-label="Quick add"
          />
          <button type="submit" class="btn-add" id="add-btn" aria-label="Add"></button>
        </div>
        <div class="preview" id="preview" aria-live="polite"></div>
        <div class="add-opts">
          <label class="mini">
            <span class="sr-only">Section</span>
            <select id="add-category" class="pillselect"></select>
          </label>
          <label class="mini" title="Default reminder for new items">
            <span class="sr-only">Default reminder</span>
            <select id="add-reminder" class="pillselect"></select>
          </label>
        </div>
      </form>

      <nav class="tabs" role="tablist" aria-label="Views" id="tabs"></nav>
      <div class="filters" id="filters" role="group" aria-label="Filter by section" hidden></div>

      <section class="list" id="list" role="tabpanel" aria-live="polite"></section>

      <footer class="foot">
        <label class="show-done">
          <input type="checkbox" id="show-done" />
          <span>Show completed</span>
        </label>
        <span class="foot-note" id="foot-note"></span>
      </footer>
    </main>

    <section class="app edit-view" id="edit-view" hidden>
      <header class="top">
        <button type="button" class="iconbtn back" id="edit-back" aria-label="Back"></button>
        <span class="name" id="edit-heading">Edit</span>
      </header>
      <div class="edit-body" id="edit-body"></div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
